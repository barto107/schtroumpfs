<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ma Collection de Schtroumpfs Schleich</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        h1, h2 { color: #333; }
        .grid { display: flex; gap: 20px; flex-wrap: wrap; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 200px; text-align: center; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
        .section { margin-bottom: 40px; }
    </style>
</head>
<body>

    <h1>Ma Collection de Figurines</h1>

    <div class="section">
        <h2>✨ Possédées</h2>
        <div class="grid" id="grid-possedees"></div>
    </div>

    <div class="section">
        <h2>🔍 Recherches</h2>
        <div class="grid" id="grid-recherches"></div>
    </div>

    <script>
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                const afficherFigurines = (liste, elementId) => {
                    const conteneur = document.getElementById(elementId);
                    if (liste.length === 0) {
                        conteneur.innerHTML = '<p>Aucune figurine pour le moment.</p>';
                        return;
                    }
                    liste.forEach(fig => {
                        conteneur.innerHTML += `
                            <div class="card">
                                <img src="${fig.image}" alt="${fig.nom}">
                                <h3>${fig.nom}</h3>
                                <p>${fig.serie}</p>
                            </div>
                        `;
                    });
                };

                afficherFigurines(data.possedees, 'grid-possedees');
                afficherFigurines(data.recherches, 'grid-recherches');
            })
            .catch(error => console.error('Erreur lors du chargement des données :', error));
    </script>
</body>
</html>
