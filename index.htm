<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ma Collection de Schtroumpfs Schleich</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        h1, h2 { color: #333; }
        .grid { display: flex; gap: 20px; flex-wrap: wrap; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 200px; text-align: center; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
        .section { margin-bottom: 40px; }
    </style>
</head>
<body>

    <h1>Ma Collection de Schtroumpfs Schleich</h1>
    
    <div style="margin-bottom: 20px;">
        <input type="text" id="searchInput" placeholder="Rechercher une figurine..." style="padding: 8px; width: 250px; border-radius: 4px; border: 1px solid #ccc;">
        <button id="resetButton" style="padding: 8px 15px; border-radius: 4px; border: 1px solid #ccc; background-color: #fff; cursor: pointer;">Réinitialiser</button>
    </div>

    <div class="section">
        <h2>✨ Possédées</h2>
        <div class="grid" id="grid-possedees"></div>
    </div>

    <div class="section">
        <h2>🔍 Recherches</h2>
        <div class="grid" id="grid-recherches"></div>
    </div>

<script>
        fetch('./data.json')
            .then(response => response.json())
            .then(data => {
                const afficherFigurines = (liste, elementId, filtre = '') => {
                    const conteneur = document.getElementById(elementId);
                    
                    const listeFiltree = liste.filter(fig => 
                        fig.nom.toLowerCase().includes(filtre.toLowerCase()) || 
                        fig.serie.toLowerCase().includes(filtre.toLowerCase())
                    );

                    if (listeFiltree.length === 0) {
                        conteneur.innerHTML = '<p>Aucune figurine trouvée.</p>';
                        return;
                    }
                    
                    let htmlContent = '';
                    listeFiltree.forEach(fig => {
                        htmlContent += `
                            <div class="card">
                                <img src="${fig.image}" alt="${fig.nom}">
                                <h3>${fig.nom}</h3>
                                <p>${fig.serie}</p>
                            </div>
                        `;
                    });
                    conteneur.innerHTML = htmlContent;
                };

                const initialiserAffichage = (filtre = '') => {
                    afficherFigurines(data.possedees, 'grid-possedees', filtre);
                    afficherFigurines(data.recherches, 'grid-recherches', filtre);
                };

                // Affichage initial
                initialiserAffichage();

                // Gestion de la recherche en direct
                const searchInput = document.getElementById('searchInput');
                searchInput.addEventListener('input', (e) => {
                    initialiserAffichage(e.target.value);
                });

                // Gestion du bouton de réinitialisation
                const resetButton = document.getElementById('resetButton');
                resetButton.addEventListener('click', () => {
                    searchInput.value = '';
                    initialiserAffichage();
                });
            })
            .catch(error => console.error('Erreur lors du chargement des données :', error));
    </script>
</body>
</html>
