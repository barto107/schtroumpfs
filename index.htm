<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ma Collection de Schtroumpfs Schleich</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        h1, h2, h3 { color: #333; }
        .grid { display: flex; gap: 20px; flex-wrap: wrap; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 200px; text-align: center; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
        .section { margin-bottom: 40px; }
        .form-container, .search-container { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: inline-block; vertical-align: top; margin-right: 20px; }
        input, select { padding: 8px; margin: 5px 0; border-radius: 4px; border: 1px solid #ccc; width: 220px; box-sizing: border-box; }
        button { padding: 8px 15px; border-radius: 4px; border: 1px solid #ccc; background-color: #007bff; color: white; cursor: pointer; }
        button#resetButton { background-color: #6c757d; }
        .delete-btn { background-color: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Ma Collection de Schtroumpfs Schleich</h1>
    
    <div>
        <div class="search-container">
            <h3>Recherche</h3>
            <input type="text" id="searchInput" placeholder="Rechercher une figurine..."><br>
            <button id="resetButton">Réinitialiser</button>
        </div>

        <div class="form-container">
            <h3>Ajouter une figurine</h3>
            <form id="addForm">
                <input type="text" id="nom" placeholder="Nom (ex: 20003 Schtroumpf...)" required><br>
                <input type="url" id="image" placeholder="URL de l'image" required><br>
                <select id="categorie">
                    <option value="possedees">Possédée</option>
                    <option value="recherches">Recherchée</option>
                </select><br>
                <button type="submit">Ajouter</button>
            </form>
        </div>
    </div>

    <div class="section">
        <h2>✨ Possédées</h2>
        <div class="grid" id="grid-possedees"></div>
    </div>

    <div class="section">
        <h2>🔍 Recherches</h2>
        <div class="grid" id="grid-recherches"></div>
    </div>

<script>
    const chargerDonnees = async () => {
        let dataStockee = localStorage.getItem('schtroumpfs_data');
        if (dataStockee) {
            return JSON.parse(dataStockee);
        } else {
            try {
                const response = await fetch('./data.json');
                const data = await response.json();
                localStorage.setItem('schtroumpfs_data', JSON.stringify(data));
                return data;
            } catch (error) {
                console.error('Erreur lors du chargement :', error);
                return { possedees: [], recherches: [] };
            }
        }
    };

    let collectionData = { possedees: [], recherches: [] };

    const afficherFigurines = (filtre = '') => {
        ['possedees', 'recherches'].forEach(cat => {
            const conteneur = document.getElementById(`grid-${cat}`);
            const liste = collectionData[cat] || [];
            
            const listeFiltree = liste.filter(fig => 
                fig.nom.toLowerCase().includes(filtre.toLowerCase()) || 
                fig.serie.toLowerCase().includes(filtre.toLowerCase())
            );

            if (listeFiltree.length === 0) {
                conteneur.innerHTML = '<p>Aucune figurine trouvée.</p>';
                return;
            }
            
            let htmlContent = '';
            listeFiltree.forEach(fig => {
                const indexReel = liste.indexOf(fig);
                htmlContent += `
                    <div class="card">
                        <img src="${fig.image}" alt="${fig.nom}">
                        <h3>${fig.nom}</h3>
                        <p>${fig.serie}</p>
                        <button class="delete-btn" onclick="supprimerFigurine('${cat}', ${indexReel})">Supprimer</button>
                    </div>
                `;
            });
            conteneur.innerHTML = htmlContent;
        });
    };

    window.supprimerFigurine = (categorie, index) => {
        if (confirm("Voulez-vous vraiment supprimer cette figurine ?")) {
            collectionData[categorie].splice(index, 1);
            localStorage.setItem('schtroumpfs_data', JSON.stringify(collectionData));
            afficherFigurines(document.getElementById('searchInput').value);
        }
    };

    chargerDonnees().then(data => {
        collectionData = data;
        afficherFigurines();
    });

    document.getElementById('addForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const nouvelleFigurine = {
            nom: document.getElementById('nom').value,
            serie: "Schtroumpfs Schleich", // Attribué automatiquement ici
            image: document.getElementById('image').value
        };
        const categorie = document.getElementById('categorie').value;

        collectionData[categorie].push(nouvelleFigurine);
        localStorage.setItem('schtroumpfs_data', JSON.stringify(collectionData));
        
        afficherFigurines();
        document.getElementById('addForm').reset();
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
        afficherFigurines(e.target.value);
    });

    document.getElementById('resetButton').addEventListener('click', () => {
        document.getElementById('searchInput').value = '';
        afficherFigurines();
    });
</script>
</body>
</html>
